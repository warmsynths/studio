<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 190" width="100%" height="100%">
  <defs>
    <linearGradient id="vcrTopGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2d"/>
      <stop offset="100%" stop-color="#1b1b1c"/>
    </linearGradient>
    <linearGradient id="vcrBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141415"/>
      <stop offset="100%" stop-color="#0d0d0e"/>
    </linearGradient>
    <linearGradient id="vcrBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1c"/>
      <stop offset="100%" stop-color="#101011"/>
    </linearGradient>
    <linearGradient id="vcrAcrylic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="55%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323235"/>
      <stop offset="100%" stop-color="#222225"/>
    </linearGradient>
    <filter id="vcrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#vcrShadow)">
    <!-- Top bevel hood -->
    <path d="M 22 0 L 570 0 L 592 46 L 0 46 Z" fill="url(#vcrTopGlow)"/>
    <!-- Ventilation grill right -->
    <rect x="532" y="12" width="40" height="16" rx="2" fill="#121213"/>
    <path d="M 536 15 h 32 M 536 19 h 32 M 536 23 h 32" stroke="#242426" stroke-width="1.5"/>

    <!-- Main Front Panel Body -->
    <rect x="0" y="44" width="592" height="88" rx="4" fill="url(#vcrBody)"/>
    <rect x="28" y="72" width="90" height="10" rx="5" fill="#2e2e30"/>
    <rect x="28" y="96" width="90" height="10" rx="5" fill="#2e2e30"/>

    <!-- Cassette Slot Door Assembly -->
    <rect x="134" y="52" width="280" height="66" rx="3" fill="#08080a" stroke="#1f1f22" stroke-width="1"/>
    <rect x="140" y="58" width="268" height="54" rx="2" fill="#111114" opacity="0.8"/>
    <!-- Slot flap line -->
    <line x1="140" y1="58" x2="408" y2="58" stroke="#333338" stroke-width="2"/>
    <text x="274" y="90" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#44444a" letter-spacing="3" text-anchor="middle">AUTO HIGH SPEED REWIND</text>

    <!-- Display Window Acrylic -->
    <rect x="424" y="50" width="156" height="70" rx="3" fill="url(#vcrAcrylic)" stroke="#222228" stroke-width="1"/>
    <!-- OSD Display Output inside Acrylic -->
    <text x="440" y="76" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#66bb6a" letter-spacing="2">0:42:18</text>
    <text x="440" y="96" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600" fill="#ffb74d" letter-spacing="1">SP  HQ</text>
    <circle cx="550" cy="72" r="4" fill="#ef5350"/>
    <text x="540" y="96" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#888890">REC</text>

    <!-- Bottom Control Strip -->
    <rect x="0" y="132" width="592" height="58" rx="0 0 4 4" fill="url(#vcrBottom)"/>
    <!-- Aluminum highlight bar -->
    <rect x="26" y="150" width="104" height="16" rx="2" fill="#d0cbbe" opacity="0.85"/>
    <text x="78" y="162" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" fill="#2a2621" letter-spacing="1" text-anchor="middle">VHS HQ STEREO</text>

    <!-- Transport Control Buttons Panel -->
    <g transform="translate(424, 142)">
      <!-- EJECT / STOP -->
      <rect x="0" y="0" width="46" height="32" rx="4" fill="url(#btnGrad)" stroke="#444448" stroke-width="1"/>
      <text x="23" y="15" font-family="Arial" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">■ ▲</text>
      <text x="23" y="26" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#aaaaaa" text-anchor="middle">EJECT</text>

      <!-- PLAY -->
      <rect x="52" y="0" width="46" height="32" rx="4" fill="url(#btnGrad)" stroke="#444448" stroke-width="1"/>
      <text x="75" y="15" font-family="Arial" font-size="10" fill="#66bb6a" font-weight="bold" text-anchor="middle">►</text>
      <text x="75" y="26" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#aaaaaa" text-anchor="middle">PLAY</text>

      <!-- REW / FF -->
      <rect x="104" y="0" width="46" height="32" rx="4" fill="url(#btnGrad)" stroke="#444448" stroke-width="1"/>
      <text x="127" y="15" font-family="Arial" font-size="9" fill="#e0e0e0" font-weight="bold" text-anchor="middle">◄◄  ►►</text>
      <text x="127" y="26" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#aaaaaa" text-anchor="middle">SEARCH</text>
    </g>
  </g>
</svg>
