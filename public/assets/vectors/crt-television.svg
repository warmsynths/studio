<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="100%" height="100%">
  <defs>
    <linearGradient id="woodCabinet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a6539"/>
      <stop offset="50%" stop-color="#7a4e28"/>
      <stop offset="100%" stop-color="#5c381a"/>
    </linearGradient>
    <linearGradient id="bezelOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9d6cd"/>
      <stop offset="100%" stop-color="#b0ad9e"/>
    </linearGradient>
    <linearGradient id="bezelInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="crtGlass" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2c2a36"/>
      <stop offset="60%" stop-color="#181622"/>
      <stop offset="100%" stop-color="#0d0c14"/>
    </radialGradient>
    <linearGradient id="knobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="50%" stop-color="#d8d4c8"/>
      <stop offset="100%" stop-color="#9e9a8e"/>
    </linearGradient>
    <filter id="tvShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#tvShadow)">
    <!-- Wooden Cabinet Outer Frame -->
    <rect x="20" y="20" width="640" height="420" rx="12" fill="url(#woodCabinet)"/>
    <!-- Top highlight -->
    <rect x="20" y="20" width="640" height="6" rx="3" fill="#b37845" opacity="0.6"/>

    <!-- Front Faceplate (Cream/Gray Bezel Surround) -->
    <rect x="40" y="38" width="600" height="384" rx="8" fill="url(#bezelOuter)"/>
    
    <!-- Left CRT Screen Frame (Dark Plastic Surround) -->
    <rect x="56" y="54" width="436" height="352" rx="12" fill="url(#bezelInner)" stroke="#111" stroke-width="2"/>
    
    <!-- Curved Glass CRT Screen Glass -->
    <rect x="84" y="80" width="380" height="300" rx="46" fill="url(#crtGlass)" stroke="#3a3848" stroke-width="3"/>
    
    <!-- CRT Scanline Sub-layer Overlay -->
    <rect x="84" y="80" width="380" height="300" rx="46" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Right Side Control Panel Area -->
    <g transform="translate(508, 54)">
      <!-- Channel Dial 1 (VHF) -->
      <circle cx="64" cy="36" r="24" fill="url(#knobGrad)" stroke="#666" stroke-width="2"/>
      <circle cx="64" cy="36" r="16" fill="#2a2a2a"/>
      <line x1="64" y1="36" x2="64" y2="20" stroke="#f0ece1" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="72" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="bold" fill="#333" text-anchor="middle">VHF TUNING</text>

      <!-- Channel Dial 2 (UHF) -->
      <circle cx="64" cy="106" r="24" fill="url(#knobGrad)" stroke="#666" stroke-width="2"/>
      <circle cx="64" cy="106" r="16" fill="#3fa89a"/>
      <line x1="64" y1="106" x2="76" y2="96" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="142" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="bold" fill="#333" text-anchor="middle">UHF / AUX</text>

      <!-- Vertical Slider / Toggle Knobs -->
      <rect x="24" y="160" width="80" height="96" rx="4" fill="#2c2c2c"/>
      <!-- Sliders -->
      <rect x="36" y="172" width="12" height="72" rx="2" fill="#181818"/>
      <rect x="34" y="196" width="16" height="12" rx="2" fill="#d9d4c5"/>
      <rect x="58" y="172" width="12" height="72" rx="2" fill="#181818"/>
      <rect x="56" y="210" width="16" height="12" rx="2" fill="#d9d4c5"/>
      <rect x="80" y="172" width="12" height="72" rx="2" fill="#181818"/>
      <rect x="78" y="182" width="16" height="12" rx="2" fill="#d9d4c5"/>

      <!-- Speaker Grille Lines -->
      <g transform="translate(16, 272)">
        <rect x="0" y="0" width="96" height="72" rx="3" fill="#1e1e1e"/>
        <line x1="8" y1="12" x2="88" y2="12" stroke="#444" stroke-width="2"/>
        <line x1="8" y1="22" x2="88" y2="22" stroke="#444" stroke-width="2"/>
        <line x1="8" y1="32" x2="88" y2="32" stroke="#444" stroke-width="2"/>
        <line x1="8" y1="42" x2="88" y2="42" stroke="#444" stroke-width="2"/>
        <line x1="8" y1="52" x2="88" y2="52" stroke="#444" stroke-width="2"/>
        <line x1="8" y1="62" x2="88" y2="62" stroke="#444" stroke-width="2"/>
      </g>
    </g>

    <!-- Bottom Cabinet Wooden Trim & Legs -->
    <rect x="20" y="440" width="640" height="24" rx="2" fill="#5c381a"/>
    <!-- Left Leg -->
    <polygon points="80,464 120,464 104,550 64,550" fill="#7a4e28" stroke="#42250e" stroke-width="2"/>
    <!-- Right Leg -->
    <polygon points="560,464 600,464 616,550 576,550" fill="#7a4e28" stroke="#42250e" stroke-width="2"/>
  </g>
</svg>
